<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki Edit War</title>
<style>
  :root {
    --bg: #f6f7f9; --ink: #1b1f24; --muted: #5b6570; --card: #ffffff; --line: #d3d8de;
    --a: #fdeceb; --a-line: #e5a7a1; --b: #e8f5ec; --b-line: #9fcfae;
    --good: #1f7a3d; --bad: #b3261e; --accent: #2b5fb4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b; --ink: #e8eaed; --muted: #9aa4ae; --card: #1d2227; --line: #343b43;
      --a: #3a2123; --a-line: #7a3d40; --b: #1d3326; --b-line: #3f7a55;
      --good: #6fd18f; --bad: #ff8b83; --accent: #8db4ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 Georgia, "Times New Roman", serif; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 18px 60px; }
  h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .bar { display: flex; gap: 18px; font-family: system-ui, sans-serif; font-size: 0.9rem; color: var(--muted); margin-bottom: 14px; }
  .bar b { color: var(--ink); }
  .article { font-family: system-ui, sans-serif; font-size: 0.95rem; margin-bottom: 10px; }
  .article a { color: var(--accent); }
  .choices { display: grid; gap: 12px; }
  .choice { text-align: left; font: inherit; color: inherit; border: 2px solid var(--line); background: var(--card);
            border-radius: 6px; padding: 14px 16px; cursor: pointer; width: 100%; }
  .choice:hover:not(:disabled) { border-color: var(--accent); }
  .choice:focus-visible, .next:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .choice:disabled { cursor: default; }
  .choice .tag { font: 0.8rem system-ui, sans-serif; color: var(--muted); display: block; margin-bottom: 4px; }
  .choice.survived { background: var(--b); border-color: var(--b-line); }
  .choice.lost { background: var(--a); border-color: var(--a-line); }
  .choice.picked { box-shadow: 0 0 0 3px var(--accent); }
  .result { font-family: system-ui, sans-serif; margin-top: 16px; }
  .result .verdict { font-size: 1.15rem; font-weight: 600; }
  .result .verdict.good { color: var(--good); }
  .result .verdict.bad { color: var(--bad); }
  .result p { margin: 6px 0; color: var(--muted); font-size: 0.92rem; }
  #summary strong { color: var(--ink); }
  .next { margin-top: 12px; font: 600 1rem system-ui, sans-serif; background: var(--accent); color: #fff; border: 0;
          border-radius: 6px; padding: 10px 18px; cursor: pointer; }
  .status { font-family: system-ui, sans-serif; color: var(--muted); padding: 30px 0; }
  .hidden { display: none; }
  .choice mark { color: inherit; border-radius: 3px; padding: 0 1px; }
  .choice mark { background: rgba(240, 180, 40, 0.38); }
  .modes { display: flex; gap: 8px; margin-bottom: 14px; }
  .mode { font: 0.9rem system-ui, sans-serif; color: var(--ink); background: var(--card); border: 1px solid var(--line);
          border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  .mode.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .mode:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .ver { position: fixed; top: 8px; right: 10px; font: 0.75rem system-ui, sans-serif; color: var(--muted); opacity: 0.8; }
  footer { margin-top: 36px; font: 0.8rem system-ui, sans-serif; color: var(--muted); }
</style>
</head>
<body>
<div class="ver">v14</div>
<main>
  <h1>Wiki Edit War</h1>
  <p class="sub" id="sub">Two versions of one Wikipedia sentence. Other editors undid one of them. Which one?</p>

  <div class="modes">
    <button class="mode on" id="mEasy">Easy (obvious changes)</button>
    <button class="mode" id="mHard">Hard (subtle changes)</button>
  </div>

  <div class="bar">
    <span>Score <b id="score">0</b> / <b id="played">0</b></span>
    <span>Streak <b id="streak">0</b></span>
  </div>

  <div id="status" class="status">Loading a real edit war...</div>
  <button class="next hidden" id="retryBtn">Try again</button>

  <section id="game" class="hidden">
    <div class="article">Article: <a id="articleLink" target="_blank" rel="noopener"></a></div>
    <div class="choices">
      <button class="choice" id="c0"><span class="tag">Version 1</span><span class="text"></span></button>
      <button class="choice" id="c1"><span class="tag">Version 2</span><span class="text"></span></button>
    </div>
    <div id="result" class="result hidden">
      <div id="verdict" class="verdict"></div>
      <p id="summary"></p>
      <p><a id="diffLink" target="_blank" rel="noopener">See the real edit on Wikipedia</a></p>
      <button class="next" id="nextBtn">Next edit war</button>
    </div>
  </section>

  <footer>Uses live data from the free Wikipedia API. No sign-up, no AI.</footer>
</main>

<script>
const API = "https://en.wikipedia.org/w/api.php";
let poolPromise = null;
let prefetched = null, prefetchMode = null, ticket = 0;
let mode = "easy";
// Skip adult or explicit topics (checked on article titles and sentences).
const SUS = /\b(sex|porn|erot|nude|nudity|naked|fetish|bdsm|bondage|genital|penis|vagin|vulva|anal|orgasm|masturbat|prostitut|escort|rape[sd]?|rapist|incest|molest|slut|whore|dildo|lingerie|stripper|strip club|hentai|playboy|onlyfans|xxx|kinky?|intercourse|nipple|testic|scrot|pedoph|paedoph|sperm|semen|clitor|erection|69)\b|\b(sex|porn|erot|genital|vagin|masturbat|prostitut|pedoph|paedoph)/i;
// Share of words that must differ between the two sentences (easy = big change, hard = small change).
const CHANGE_RANGE = { easy: [0.3, 1.01], hard: [0.1, 0.3] };
let score = 0, played = 0, streak = 0;
let current = null;

const $ = (id) => document.getElementById(id);

async function api(params) {
  const url = API + "?" + new URLSearchParams({ ...params, format: "json", formatversion: "2", origin: "*" });
  for (let tries = 0; ; tries++) {
    const res = await fetch(url);
    if (res.status === 429 && tries < 3) {
      await new Promise((r) => setTimeout(r, 1500 * 2 ** tries));
      continue;
    }
    if (!res.ok) throw new Error("Wikipedia answered with status " + res.status);
    const data = await res.json();
    if (data.error) throw new Error("Wikipedia said: " + data.error.info);
    return data;
  }
}

// Well-known articles: last month's most-viewed pages, asked from Wikipedia (nothing is hardcoded).
// If that fails, fall back to articles that were reverted recently.
async function loadPool() {
  try {
    const d = new Date();
    d.setUTCDate(1);
    d.setUTCMonth(d.getUTCMonth() - 1);
    const mm = String(d.getUTCMonth() + 1).padStart(2, "0");
    const res = await fetch("https://wikimedia.org/api/rest_v1/metrics/pageviews/top/en.wikipedia/all-access/" +
      d.getUTCFullYear() + "/" + mm + "/all-days");
    if (res.ok) {
      const data = await res.json();
      const list = data.items[0].articles.map((a) => a.article.replace(/_/g, " "))
        .filter((t) => t !== "Main Page" && t !== "-" && !t.includes(":") && !/^(List of|Lists of|Deaths in)/.test(t) && !SUS.test(t));
      if (list.length > 0) return list;
    }
  } catch (e) {
    console.error(e);
  }
  const data = await api({ action: "query", list: "recentchanges", rctag: "mw-reverted",
    rcnamespace: "0", rctype: "edit", rclimit: "500", rcprop: "title" });
  return [...new Set(data.query.recentchanges.map((c) => c.title))];
}

async function getPool() {
  if (!poolPromise) poolPromise = loadPool();
  return poolPromise.catch(() => []);
}

async function pickTitle(popularChance) {
  if (Math.random() < popularChance) {
    const pool = await getPool();
    if (pool.length > 0) return pool[Math.floor(Math.random() * pool.length)];
  }
  const data = await api({ action: "query", list: "random", rnnamespace: "0", rnlimit: "10" });
  const safe = data.query.random.map((r) => r.title).filter((t) => !SUS.test(t));
  return safe[0] || data.query.random[0].title;
}

// A random moment since Wikipedia started (January 2001).
function randomTime() {
  const first = Date.UTC(2001, 0, 15);
  return new Date(first + Math.random() * (Date.now() - first)).toISOString();
}

// Recent reverts straight from Wikipedia's recent-changes feed, well-known articles first.
let revertQueue = [], refilling = null;
function refillReverts() {
  if (refilling) return refilling;
  refilling = (async () => {
    const popular = new Set(await getPool());
    const start = new Date(Date.now() - Math.random() * 60 * 86400000).toISOString();
    const tags = ["mw-manual-revert", "mw-undo", "mw-rollback"];
    const lists = await Promise.all(tags.map((t) =>
      api({ action: "query", list: "recentchanges", rctag: t, rcnamespace: "0", rctype: "edit",
        rclimit: "500", rcstart: start, rcdir: "older", rcprop: "ids|title|comment" })
        .then((d) => d.query.recentchanges).catch(() => [])));
    const seen = new Set();
    const all = [];
    lists.flat().forEach((c) => {
      if (c.old_revid && !seen.has(c.revid) && !SUS.test(c.title)) { seen.add(c.revid); all.push(c); }
    });
    all.sort(() => Math.random() - 0.5);
    revertQueue.push(...all.filter((c) => popular.has(c.title)), ...all.filter((c) => !popular.has(c.title)));
  })().finally(() => { refilling = null; });
  return refilling;
}

// Turn wiki code into plain readable text.
function clean(line) {
  let t = line
    .replace(/<!--[\s\S]*?-->/g, "")
    .replace(/<ref[^>]*\/>/g, "")
    .replace(/<ref[^>]*>[\s\S]*?<\/ref>/g, "")
    .replace(/&nbsp;/g, " ");
  while (/\{\{[^{}]*\}\}/.test(t)) t = t.replace(/\{\{[^{}]*\}\}/g, "");
  return t
    .replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g, "$1")
    .replace(/'{2,}/g, "")
    .replace(/<[^>]+>/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function similarity(a, b) {
  const wa = new Set(a.toLowerCase().split(/\W+/));
  const wb = new Set(b.toLowerCase().split(/\W+/));
  let shared = 0;
  wa.forEach((w) => { if (wb.has(w)) shared++; });
  return shared / Math.max(wa.size, wb.size);
}

// Compare two sentences word by word; changed words get flagged.
function diffWords(a, b) {
  const x = a.split(" "), y = b.split(" ");
  const dp = Array.from({ length: x.length + 1 }, () => new Array(y.length + 1).fill(0));
  for (let i = x.length - 1; i >= 0; i--) {
    for (let j = y.length - 1; j >= 0; j--) {
      dp[i][j] = x[i] === y[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  const xs = [], ys = [];
  let i = 0, j = 0;
  while (i < x.length && j < y.length) {
    if (x[i] === y[j]) { xs.push({ t: x[i], d: false }); ys.push({ t: y[j], d: false }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { xs.push({ t: x[i], d: true }); i++; }
    else { ys.push({ t: y[j], d: true }); j++; }
  }
  while (i < x.length) xs.push({ t: x[i++], d: true });
  while (j < y.length) ys.push({ t: y[j++], d: true });
  return [xs, ys];
}

function renderParts(el, parts) {
  el.textContent = "";
  parts.forEach((p, k) => {
    const node = p.d ? document.createElement("mark") : document.createElement("span");
    node.textContent = p.t;
    el.appendChild(node);
    if (k < parts.length - 1) el.appendChild(document.createTextNode(" "));
  });
}

// Keep only ordinary sentences: no adult topics, captions, file names, references or code.
function isPlain(text) {
  if (text.length < 50 || text.length >= 500) return false;
  if (SUS.test(text)) return false;
  if (/[|{}<>\[\]=]|http|www\.|&[a-z#0-9]+;/i.test(text)) return false;
  if (/\.(jpe?g|png|gif|svg|webp|pdf|ogg|mp3|tiff?)\b/i.test(text)) return false;
  if (!/^["“'(]?[A-Z0-9]/.test(text)) return false;
  if (!/[.!?]["”'’)]*$/.test(text)) return false;
  const letters = (text.match(/[A-Za-z]/g) || []).length;
  return letters / text.length >= 0.7;
}

// Cut a paragraph into single sentences (without splitting on "Dr." or "U.S.").
const ABBREVIATIONS = /^(?:[A-Z]|Mr|Mrs|Ms|Dr|St|Jr|Sr|vs|No|Inc|Ltd|Co|Mt|Gen|Col|Sen|Rep|Gov|Prof|Rev|Lt|Capt|Sgt|Jan|Feb|Mar|Apr|Aug|Sept|Oct|Nov|Dec|U\.S|U\.K|e\.g|i\.e|c|ca)\.$/;
function splitSentences(text) {
  const out = [];
  const re = /[.!?]["”’')\]]*\s+(?=["“‘(]?[A-Z0-9])/g;
  let start = 0, m;
  while ((m = re.exec(text))) {
    const piece = text.slice(start, m.index + m[0].trimEnd().length);
    if (ABBREVIATIONS.test(piece.split(" ").pop())) continue;
    out.push(piece.trim());
    start = m.index + m[0].length;
  }
  out.push(text.slice(start).trim());
  return out.filter(Boolean);
}

// Ask Wikipedia for just the changed lines (small), then find one sentence that was reworded.
async function diffPair(params, range) {
  const data = await api({ action: "compare", prop: "diff|timestamp", ...params });
  const html = (data.compare && data.compare.body) || "";
  const doc = new DOMParser().parseFromString("<table>" + html + "</table>", "text/html");
  const rows = [];
  doc.querySelectorAll("tr").forEach((tr) => {
    const d = tr.querySelector("td.diff-deletedline"), a = tr.querySelector("td.diff-addedline");
    if (!d || !a) return;
    const r = d.textContent.trim(), b = a.textContent.trim();
    if (/^[|{}!*#:;=<-]/.test(r) || /^[|{}!*#:;=<-]/.test(b)) return;
    if (/\[\[(File|Image|Category|Media):/i.test(r + b)) return;
    rows.push([r, b]);
  });
  rows.sort(() => Math.random() - 0.5);
  for (const [r, b] of rows) {
    const sentsA = splitSentences(clean(r)), sentsB = splitSentences(clean(b));
    const pairs = [];
    for (const sa of sentsA) {
      if (sentsB.includes(sa) || !isPlain(sa)) continue;
      let best = null, bestSim = 0.35;
      for (const sb of sentsB) {
        if (sentsA.includes(sb) || !isPlain(sb)) continue;
        const sim = similarity(sa, sb);
        if (sim > bestSim) { best = sb; bestSim = sim; }
      }
      if (!best) continue;
      const [partsA, partsB] = diffWords(sa, best);
      const changed = (partsA.filter((w) => w.d).length + partsB.filter((w) => w.d).length) / (partsA.length + partsB.length);
      if (changed >= range[0] && changed < range[1]) pairs.push({ textA: sa, textB: best, partsA: partsA, partsB: partsB });
    }
    if (pairs.length > 0) {
      const pick = pairs[Math.floor(Math.random() * pairs.length)];
      return { ...pick, timeA: data.compare.fromtimestamp, timeB: data.compare.totimestamp };
    }
  }
  return null;
}

// Show a timestamp as a short date and time, e.g. "Mar 3, 2015, 4:20 PM".
function niceTime(ts) {
  if (!ts) return "";
  return new Date(ts).toLocaleString([], { year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

// Turn an edit note's wiki code into plain words.
function cleanComment(c) {
  return c
    .replace(/\s*\(\[\[User talk:[^\]]*\]\]\)/g, "")
    .replace(/\s*\(\[\[WP:[^\]]*\]\]\)/g, "")
    .replace(/\/\*.*?\*\//g, "")
    .replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g, "$1")
    .replace(/^(?:Reverted|Reverting|Undid|Undoing)\b[^:]*?\bby\b[^:]*(?::|$)\s*/i, "")
    .replace(/\s*\((?:RW|TW|AWB|HG|STiki|Huggle)[^)]*\)/gi, "")
    .replace(/\s*\(talk\)/gi, "")
    .replace(/'{2,}/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function wikiUrl(title) {
  return "https://en.wikipedia.org/wiki/" + encodeURIComponent(title.replace(/ /g, "_"));
}

// Older reverts: scan one article's history from a random moment (edits tagged as reverts,
// or edits that restored an exact earlier copy of the page).
async function findOldReverts(title) {
  const tags = ["mw-manual-revert", "mw-undo", "mw-rollback"];
  const data = await api({
    action: "query", prop: "revisions", titles: title,
    rvlimit: "500", rvdir: "newer", rvstart: randomTime(), rvprop: "ids|tags|comment|sha1"
  });
  const revs = data.query.pages[0].revisions || [];
  const seen = new Map();
  const found = [];
  revs.forEach((r, i) => {
    const tagged = r.tags && r.tags.some((t) => tags.includes(t));
    const earlier = r.sha1 ? seen.get(r.sha1) : undefined;
    if (r.parentid && (tagged || (earlier !== undefined && earlier < i - 1))) {
      found.push({ title: title, revid: r.revid, old_revid: r.parentid, comment: r.comment || "" });
    }
    if (r.sha1) seen.set(r.sha1, i);
  });
  return found.sort(() => Math.random() - 0.5).slice(0, 5);
}

// One round: a sentence that was edited, then undone. The answer is the undone version.
async function makeRound(m) {
  let candidates;
  if (Math.random() < 0.3) {
    const title = await pickTitle(0.9);
    candidates = SUS.test(title) ? [] : await findOldReverts(title);
  } else {
    if (revertQueue.length === 0) await refillReverts();
    candidates = [revertQueue.shift()];
  }
  for (const rc of candidates) {
    if (!rc) continue;
    const pair = await diffPair({ fromrev: String(rc.old_revid), torev: String(rc.revid) }, CHANGE_RANGE[m]);
    if (!pair) continue;
    const note = cleanComment(rc.comment || "");
    return {
      title: rc.title,
      summary: note ? "Note from the editor who undid it: " : "The editor left no note.",
      note: note,
      diffUrl: "https://en.wikipedia.org/w/index.php?title=" + encodeURIComponent(rc.title.replace(/ /g, "_")) +
        "&diff=" + rc.revid + "&oldid=" + rc.old_revid,
      options: [
        { text: pair.textA, parts: pair.partsA, undone: true, note: "this one was undone", when: niceTime(pair.timeA) },
        { text: pair.textB, parts: pair.partsB, undone: false, note: "this one was kept", when: niceTime(pair.timeB) }
      ].sort(() => Math.random() - 0.5)
    };
  }
  return null;
}

// Try two articles at the same time and keep the first good result.
async function buildRound(m) {
  let lastError = null, done = false;
  const worker = async () => {
    for (let n = 0; n < 25 && !done; n++) {
      try {
        const round = await makeRound(m);
        if (round) return round;
      } catch (e) {
        console.error(e);
        lastError = e;
      }
    }
    throw new Error("no match");
  };
  try {
    return await Promise.any([worker(), worker()]);
  } catch (e) {
    throw new Error("Could not find a good pair (" + (lastError ? lastError.message : "no matches") + ")");
  } finally {
    done = true;
  }
}

// Start building the next round while the player is still reading this one.
function prefetch() {
  prefetchMode = mode;
  prefetched = buildRound(mode);
  prefetched.catch(() => {});
}

function show(round) {
  current = round;
  $("articleLink").textContent = round.title;
  $("articleLink").href = wikiUrl(round.title);
  round.options.forEach((opt, i) => {
    const btn = $("c" + i);
    btn.disabled = false;
    btn.className = "choice";
    renderParts(btn.querySelector(".text"), opt.parts);
    btn.querySelector(".tag").textContent = "Version " + (i + 1);
  });
  $("result").classList.add("hidden");
  $("status").classList.add("hidden");
  $("game").classList.remove("hidden");
}

function guess(i) {
  const opts = current.options;
  const correct = opts[i].undone;
  played++;
  if (correct) { score++; streak++; } else { streak = 0; }
  opts.forEach((opt, k) => {
    const btn = $("c" + k);
    btn.disabled = true;
    btn.classList.add(opt.undone ? "lost" : "survived");
    if (k === i) btn.classList.add("picked");
    btn.querySelector(".tag").textContent =
      "Version " + (k + 1) + " - " + opt.note + (opt.when ? " - " + opt.when : "");
  });
  $("verdict").textContent = correct ? "You got it." : "Not this time.";
  $("verdict").className = "verdict " + (correct ? "good" : "bad");
  $("summary").textContent = current.summary;
  $("summary").classList.toggle("hidden", !current.summary);
  if (current.note) {
    const bold = document.createElement("strong");
    bold.textContent = current.note;
    $("summary").appendChild(bold);
  }
  $("diffLink").href = current.diffUrl;
  $("score").textContent = score;
  $("played").textContent = played;
  $("streak").textContent = streak;
  $("result").classList.remove("hidden");
  $("nextBtn").focus();
}

async function nextRound() {
  const my = ++ticket;
  $("game").classList.add("hidden");
  $("status").textContent = "Loading a real edit war...";
  $("status").classList.remove("hidden");
  $("retryBtn").classList.add("hidden");
  try {
    const waiting = prefetched, waitingMode = prefetchMode;
    prefetched = null;
    let round = null;
    if (waiting && waitingMode === mode) {
      try { round = await waiting; } catch (e) { console.error(e); }
    }
    if (!round) round = await buildRound(mode);
    if (my !== ticket) return;
    show(round);
    prefetch();
  } catch (e) {
    if (my !== ticket) return;
    $("status").textContent = "Something went wrong: " + e.message;
    $("retryBtn").classList.remove("hidden");
  }
}

$("c0").addEventListener("click", () => guess(0));
$("c1").addEventListener("click", () => guess(1));
function setMode(m) {
  mode = m;
  $("mEasy").classList.toggle("on", m === "easy");
  $("mHard").classList.toggle("on", m === "hard");
  nextRound();
}

$("mEasy").addEventListener("click", () => setMode("easy"));
$("mHard").addEventListener("click", () => setMode("hard"));
$("nextBtn").addEventListener("click", nextRound);
$("retryBtn").addEventListener("click", nextRound);
nextRound();
</script>
</body>
</html>
