<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki Edit War</title>
<style>
  :root {
    --bg: #f6f7f9; --ink: #1b1f24; --muted: #5b6570; --card: #ffffff; --line: #d3d8de;
    --a: #fdeceb; --a-line: #e5a7a1; --b: #e8f5ec; --b-line: #9fcfae;
    --good: #1f7a3d; --bad: #b3261e; --accent: #2b5fb4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b; --ink: #e8eaed; --muted: #9aa4ae; --card: #1d2227; --line: #343b43;
      --a: #3a2123; --a-line: #7a3d40; --b: #1d3326; --b-line: #3f7a55;
      --good: #6fd18f; --bad: #ff8b83; --accent: #8db4ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 Georgia, "Times New Roman", serif; }
  main { max-width: 900px; margin: 0 auto; padding: 28px 18px 60px; }
  h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; font-family: system-ui, sans-serif; font-size: 0.9rem; color: var(--muted); margin-bottom: 14px; }
  .bar b { color: var(--ink); }
  .wikititle { font: normal 1.9rem/1.25 "Linux Libertine", Georgia, Times, serif; margin: 0 0 2px; padding-bottom: 2px; border-bottom: 1px solid var(--line); }
  .wikititle a { color: var(--ink); text-decoration: none; }
  .wikititle a:hover { text-decoration: underline; }
  .fromwiki { font: 0.82rem system-ui, sans-serif; color: var(--muted); margin-bottom: 14px; }
  .prompt { font: 600 1.05rem system-ui, sans-serif; margin: 0 0 10px; }
  .layout { display: flex; gap: 18px; align-items: flex-start; }
  .layout .choices { flex: 1; min-width: 0; }
  .pic { width: 220px; flex: none; }
  .pic img { width: 100%; display: block; padding: 3px; background: var(--card); border: 1px solid var(--line); }
  @media (max-width: 640px) { .layout { flex-direction: column-reverse; } .pic { width: 100%; max-width: 260px; } }
  .choices { display: grid; gap: 12px; }
  .choice { text-align: left; font: inherit; color: inherit; border: 2px solid var(--line); background: var(--card);
            border-radius: 6px; padding: 14px 16px; cursor: pointer; width: 100%; }
  .choice:hover:not(:disabled) { border-color: var(--accent); }
  .choice:focus-visible, .next:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .choice:disabled { cursor: default; }
  .choice .tag { font: 0.8rem system-ui, sans-serif; color: var(--muted); display: block; margin-bottom: 4px; }
  .choice.correct { background: var(--b); border-color: var(--b-line); }
  .choice.wrong { background: var(--a); border-color: var(--a-line); }
  .choice.picked { box-shadow: 0 0 0 3px var(--accent); }
  .result { font-family: system-ui, sans-serif; margin-top: 16px; }
  .result .verdict { font-size: 1.15rem; font-weight: 600; }
  .result .verdict.good { color: var(--good); }
  .result .verdict.bad { color: var(--bad); }
  .result p { margin: 6px 0; color: var(--muted); font-size: 0.92rem; }
  #summary strong { color: var(--ink); }
  .next { margin-top: 12px; font: 600 1rem system-ui, sans-serif; background: var(--accent); color: #fff; border: 0;
          border-radius: 6px; padding: 10px 18px; cursor: pointer; }
  .status { font-family: system-ui, sans-serif; color: var(--muted); padding: 30px 0; }
  .hidden { display: none; }
  .linkbtn { font: inherit; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; }
  #shareBox { margin-top: 14px; }
  #shareText { width: 100%; margin: 8px 0 4px; padding: 8px; resize: none; font: 0.9rem ui-monospace, Menlo, Consolas, monospace;
               background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; }
  .choice mark { color: inherit; border-radius: 3px; padding: 0 1px; }
  .choice mark { background: rgba(240, 180, 40, 0.38); }
  .ver { position: fixed; top: 8px; right: 10px; font: 0.75rem system-ui, sans-serif; color: var(--muted); opacity: 0.8; }
  footer select { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 4px; }
  footer { margin-top: 36px; font: 0.8rem system-ui, sans-serif; color: var(--muted); }
</style>
</head>
<body>
<div class="ver">v43</div>
<main>
  <h1>Wiki Edit War</h1>
  <p class="sub" id="sub">One version of a Wikipedia sentence is a fix. The other is the mistake it fixed.</p>

  <div class="bar">
    <span id="modeLabel"></span>
    <span>Score <b id="score">0</b> / <b id="played">0</b></span>
    <span>Streak <b id="streak">0</b></span>
    <button class="linkbtn hidden" id="dailyBtn">Copy today's daily result</button>
  </div>

  <div id="status" class="status">Loading a real edit war...</div>
  <button class="next hidden" id="retryBtn">Try again</button>

  <section id="game" class="hidden">
    <h2 class="wikititle"><a id="articleLink" target="_blank" rel="noopener"></a></h2>
    <div class="fromwiki">From Wikipedia, the free encyclopedia</div>
    <p class="prompt" id="prompt">Which version is the fix?</p>
    <div class="layout">
      <div class="choices">
        <button class="choice" id="c0"><span class="tag">Version 1</span><span class="text"></span></button>
        <button class="choice" id="c1"><span class="tag">Version 2</span><span class="text"></span></button>
      </div>
      <div class="pic hidden" id="pic"><img id="picImg" alt=""></div>
    </div>
    <div id="result" class="result hidden">
      <div id="verdict" class="verdict"></div>
      <p id="summary"></p>
      <p><a id="diffLink" target="_blank" rel="noopener">See the real edit on Wikipedia</a></p>
      <div id="shareBox" class="hidden">
        <div class="verdict" id="shareHead"></div>
        <textarea id="shareText" readonly rows="4"></textarea>
        <button class="next" id="copyBtn">Copy for Discord</button>
      </div>
      <button class="next" id="nextBtn">Next edit war</button>
    </div>
  </section>

  <footer>Popular articles in:
    <select id="region">
      <option value="US">United States</option>
      <option value="GB">United Kingdom</option>
      <option value="CA">Canada</option>
      <option value="AU">Australia</option>
      <option value="IN">India</option>
      <option value="">Worldwide</option>
    </select>
  </footer>
</main>

<script>
const API = "https://en.wikipedia.org/w/api.php";
let poolPromise = null;
let prefetched = null, ticket = 0;
let region = "US";
// Skip adult or explicit topics (checked on article titles and sentences).
const SUS = /\b(sex|porn|erot|nude|nudity|naked|fetish|bdsm|bondage|genital|penis|vagin|vulva|anal|orgasm|masturbat|prostitut|escort|rape[sd]?|rapist|incest|molest|slut|whore|dildo|lingerie|stripper|strip club|hentai|playboy|onlyfans|xxx|kinky?|intercourse|nipple|testic|scrot|pedoph|paedoph|sperm|semen|clitor|erection|69)\b|\b(sex|porn|erot|genital|vagin|masturbat|prostitut|pedoph|paedoph)/i;
// Skip profanity, slurs and crude insults in article titles and sentences.
const BAD_TEXT = /\b(fuck\w*|shit\w*|bullshit|bitch\w*|cunt\w*|dick\w*|cock\w*|pussy|asshole\w*|arse\w*|bastard\w*|piss\w*|crap\w*|damn\w*|bollocks|wank\w*|twat|slut\w*|whore\w*|bimbo\w*|topless|retard\w*|spastic|moron\w*|idiot\w*|stupid|nigg\w*|negro\w*|coon|chink\w*|gook|spic|wetback|kike|fag|fags|faggot\w*|dyke|tranny|shemale|paki|raghead|towelhead|honky|poop\w*|fart\w*|boob\w*|tits?|butt|gay|gays|lesbian\w*|homosexual\w*|nationalist\w*|supremac\w*|nazi\w*|fascis\w*|racis\w*|sexis\w*|assassinat\w*|murder\w*|kill\w*|shot|shoot\w*|massacre\w*|genocide\w*|holocaust|terror\w*|bomb\w*|suicid\w*|died|dies|death|deaths|dead|fatal\w*|victims?|funeral\w*|tragedy|tragic|disaster|crash\w*|war crimes?|execut\w*|stabb\w*|lynch\w*|abus\w*|kidnap\w*|hostages?|manslaughter|overdos\w*|casualt\w*|brothel\w*|hooker\w*|pimp\w*|harlot\w*|sexual\w*|sexy|horny|boner|lust\w*|aroused|arousal|molest\w*|semen|orgy|fetish\w*|jackass\w*|dumbass\w*|badass\w*|smartass\w*|fatass\w*|kickass|asswipe|ass|asses|motherfuck\w*|handjob\w*|headjob\w*|blowjob\w*|rimjob\w*|jerk(?:ing)? off|masturbat\w*|orgasm\w*|ejaculat\w*|genital\w*|testicle\w*|scrotum|nutsack|ballsack|butthole\w*|schlong)\b/i;
// Gender-swap vandalism: skip when a pronoun or gendered word is among the changed words.
const GENDER = /^(he|she|his|her|hers|him|himself|herself|man|woman|men|women|male|female|boy|girl|mr|mrs|ms)$/i;
// Words that must not appear among the changed words: race, religion and body jokes.
// Profanity hiding inside a longer word (like "Motherfucker"); only checked on changed words.
const PROFANE_PART = /(fuck|shit|cunt|nigg|bitch|cock|dick|pussy|whore|slut|bastard|wank|twat|jackass|dumbass|badass|smartass|asshole|arsehole|faggot|retard|porn|penis|vagina|dildo|handjob|headjob|blowjob|rimjob|masturbat|orgasm|ejaculat|genital|testicle|scrotum|nutsack|ballsack|butthole|schlong)/i;
const BAD_CHANGED = /^(balls?|ballz|milf|milfs|momma|mommy|daddy|booty|butts?|boobs?|nuts|cum|jizz|anus|dong|wiener|willy|peen|hoes?|thot|sucks?|sucked|licks?|licked|mouth|poop|pee|peepee|poopy|weed|stoned|drunk|horny|thicc|twerk\w*|black|white|asian|jew\w*|arab\w*|mexican\w*|chinese|african\w*|hispanic|latino\w*|muslim\w*|islam\w*|inch|inches|huge|tiny|midget\w*|dwarf|fat|ugly|skinny|obese)$/i;
// Skip edits whose note is about hate or bigotry (racism, sexism and the other -isms).
const BAD_NOTE = /\b(racis\w*|racial\w*|sexis\w*|ableis\w*|ageis\w*|homophob\w*|transphob\w*|biphob\w*|islamophob\w*|antisemit\w*|anti-semit\w*|xenophob\w*|misogyn\w*|misandr\w*|bigot\w*|supremac\w*|nazi\w*|hitler|slurs?|hate|hateful|hate speech|offensive|derogatory|pejorative|discriminat\w*|n-word|f-word|epithets?|abusive|harass\w*|profan\w*|obscen\w*|swear\w*|vulgar\w*|explicit|lewd|crude)\b/i;

// Skip touchy subjects so the game stays light: politics, gender, abortion, immigration, religion, conflicts.
const CONTROVERSY = /\b(non-?binary|transgender|trans|pronouns?|they\/them|gender\w*|abortion\w*|pro-?life|pro-?choice|immigra\w*|deport\w*|ICE|border|political\w*|politic\w*|trump|biden|obama|democrat\w*|republican\w*|conservativ\w*|liberal\w*|election\w*|israel\w*|palestin\w*|gaza|hamas|ukrain\w*|russia\w*|putin|religio\w*|christian\w*|muslim\w*|jewish|catholic|controvers\w*|protest\w*|lawsuit\w*|sued|allegation\w*|alleged\w*|scandal\w*|privacy|surveillance|police|gun\w*|firearm\w*)\b/i;

// Share of words that must differ between the two sentences.
// Test mode: open the page with ?test on the end of the link. It is always endless and uses looser rules.
const TEST = new URLSearchParams(location.search).has("test");
const MIN_CHANGE = TEST ? 0.08 : 0.15;
const MIN_SIM = TEST ? 0.25 : 0.35;
const MIN_LENGTH_RATIO = TEST ? 0.4 : 0.55;
const MIN_SENTENCE = TEST ? 35 : 50;
const EDITS_TO_TRY = TEST ? 8 : 4;
const POPULAR_CHANCE = TEST ? 0.4 : 0.95;

let score = 0, played = 0, streak = 0;
let current = null;
const DAILY_COUNT = 5;
// Debug numbers: open the browser console and type wikiDebug to see them.
const wikiDebug = { attempts: 0, noEdits: 0, noPair: 0, repeats: 0, unsafe: 0, slowdowns: 0, waitedMs: 0, found: {}, shown: {} };
window.wikiDebug = wikiDebug;
// Shows what is happening right now while a question is loading, so it doesn't look stuck.
let loading = false;
function progress(text) {
  if (!loading) return;
  $("status").textContent = text + (wikiDebug.attempts ? " (" + wikiDebug.attempts + " articles checked so far)" : "");
}
const SHARE_URL = "https://chadduffenshmoogle.github.io/wiki-edits/";

// Saved in this browser only (so "never the same edit twice" is per browser).
function load(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch (e) {
    return fallback;
  }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}
const seen = new Set(load("wikiSeen", []));
// Articles shown lately, so the same article does not keep coming back (endless mode).
let recentTitles = load("wikiTitles", []);
function saveSeen() { save("wikiSeen", [...seen].slice(-4000)); }
// Pick up edits another tab of this browser has already shown.
function syncSeen() { load("wikiSeen", []).forEach((k) => seen.add(k)); }
// A short fingerprint of the two sentences, so the same joke added by different edits counts as a repeat.
function textKey(a, b) {
  const t = (a + "|" + b).toLowerCase().replace(/\W+/g, "");
  let h = 5381;
  for (let i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0;
  return "t:" + h;
}

// The daily challenge: same five questions for everyone on the same UTC date.
const todayKey = new Date().toISOString().slice(0, 10);
const dailyNumber = Math.max(1, Math.floor((Date.parse(todayKey) - Date.UTC(2026, 9, 21)) / 864e5) + 1);
let daily = load("wikiDaily", null);
if (!daily || daily.key !== todayKey) daily = { key: todayKey, results: [], titles: [] };
let mode = TEST || daily.results.length >= DAILY_COUNT ? "endless" : "daily";

const $ = (id) => document.getElementById(id);

// Politeness: only a few requests at once, a small gap between them, and when Wikipedia says
// "slow down" every request waits. Its slow-down reply has no permission header, so the browser
// shows it as a blocked ("Failed to fetch") request instead of a 429, and that counts too.
const MAX_REQUESTS = 3;
const GAP_MS = 120;
let inFlight = 0, pausedUntil = 0, nextStart = 0;
const slotQueue = [];
function takeSlot() {
  return new Promise((resolve) => {
    const go = () => { inFlight++; resolve(); };
    if (inFlight < MAX_REQUESTS) go(); else slotQueue.push(go);
  });
}
function freeSlot() {
  inFlight--;
  const next = slotQueue.shift();
  if (next) next();
}
const pause = (ms) => new Promise((r) => setTimeout(r, ms));

function whatIs(url) {
  try {
    const q = new URL(url).searchParams;
    if (q.get("action") === "compare") return "comparing edits " + q.get("fromrev") + " vs " + q.get("torev");
    if (q.get("list") === "random") return "asking for random articles";
    if (q.get("prop") === "revisions") return "reading edit history of " + q.get("titles");
    if (q.get("prop")) return "asking for " + q.get("prop") + " of " + (q.get("titles") || "an article");
    return url.slice(0, 90);
  } catch (e) { return url.slice(0, 90); }
}

async function limitedFetch(url) {
  await takeSlot();
  try {
    for (let tries = 0; ; tries++) {
      const startAt = Math.max(Date.now(), pausedUntil, nextStart);
      nextStart = startAt + GAP_MS;
      if (startAt > Date.now()) await pause(startAt - Date.now());
      let res = null;
      const began = performance.now();
      try {
        res = await fetch(url);
      } catch (e) {
        res = null;
      }
      const took = Math.round(performance.now() - began);
      if ((res === null || res.status === 429) && tries < 4) {
        pausedUntil = Math.max(pausedUntil, Date.now() + 2000 * 2 ** tries + Math.random() * 1000);
        const waitMs = Math.round(pausedUntil - Date.now());
        wikiDebug.slowdowns++;
        wikiDebug.waitedMs += waitMs;
        console.warn("[wiki] Wikipedia said slow down (" + (res === null ? "blocked" : "429") + ") while " + whatIs(url) +
          " after " + took + " ms. Everything waits " + waitMs + " ms, then retry " + (tries + 1) + " of 4.");
        progress("Wikipedia is busy, waiting a few seconds before trying again...");
        continue;
      }
      if (res !== null) console.debug("[wiki] " + whatIs(url) + " -> " + res.status + " in " + took + " ms");
      if (res === null) throw new Error("Could not reach Wikipedia (it may be asking us to slow down). Wait a minute and try again.");
      return res;
    }
  } finally {
    freeSlot();
  }
}

async function api(params) {
  const url = API + "?" + new URLSearchParams({ ...params, format: "json", formatversion: "2", origin: "*" });
  const res = await limitedFetch(url);
  if (!res.ok) throw new Error("Wikipedia answered with status " + res.status);
  const data = await res.json();
  if (data.error) throw new Error("Wikipedia said: " + data.error.info);
  return data;
}

// Well-known articles: what people in the chosen country (or worldwide) read most, in each of the
// last 3 months. Titles that show up in 2 or more months are the steady, well-known ones.
async function topList(country, year, month) {
  const base = "https://wikimedia.org/api/rest_v1/metrics/pageviews/";
  const url = country
    ? base + "top-per-country/" + country + "/all-access/" + year + "/" + month + "/15"
    : base + "top/en.wikipedia/all-access/" + year + "/" + month + "/all-days";
  const res = await limitedFetch(url);
  if (!res.ok) throw new Error("Pageview list answered with status " + res.status);
  const data = await res.json();
  return data.items[0].articles
    .filter((a) => !a.project || a.project === "en.wikipedia")
    .map((a) => a.article.replace(/_/g, " "));
}

async function loadPool(country, strict, backs) {
  const lists = await Promise.all(backs.map(async (back) => {
    const d = new Date();
    d.setUTCDate(1);
    d.setUTCMonth(d.getUTCMonth() - back);
    try {
      return await topList(country, d.getUTCFullYear(), String(d.getUTCMonth() + 1).padStart(2, "0"));
    } catch (e) {
      if (strict) throw e;
      console.error(e);
      return [];
    }
  }));
  const counts = new Map();
  lists.forEach((list) => list.forEach((t) => counts.set(t, (counts.get(t) || 0) + 1)));
  let titles = [...counts.keys()].filter((t) =>
    t !== "Main Page" && t !== "-" && !t.includes(":") && !/^(List of|Lists of|Deaths in)/.test(t) && !SUS.test(t) && !BAD_TEXT.test(t));
  const steady = titles.filter((t) => counts.get(t) >= 2);
  if (steady.length >= 80) titles = steady;
  if (titles.length === 0 && strict) throw new Error("No popular articles found");
  if (titles.length === 0 && country) return loadPool("", false, backs);
  return titles;
}

async function getPool() {
  if (!poolPromise) {
    progress("Loading the list of popular articles...");
    poolPromise = loadPool(region, false, [1, 2, 3]);
  }
  return poolPromise.catch(() => []);
}

// The daily challenge always uses the United States list from 2 to 4 months back, so it is the same
// for everyone and does not change when a new month's list is published.
let dailyPoolPromise = null;
function getDailyPool() {
  if (!dailyPoolPromise) {
    progress("Loading the list of popular articles...");
    dailyPoolPromise = loadPool("US", true, [2, 3, 4])
      .catch(() => loadPool("", true, [2, 3, 4]))
      .catch((e) => { dailyPoolPromise = null; throw e; });
  }
  return dailyPoolPromise;
}

async function pickTitle(popularChance, rand) {
  if (rand() < popularChance) {
    const pool = await getPool();
    if (pool.length > 0) return pool[Math.floor(rand() * pool.length)];
  }
  const data = await api({ action: "query", list: "random", rnnamespace: "0", rnlimit: "10" });
  const safe = data.query.random.map((r) => r.title).filter((t) => !SUS.test(t));
  return safe[0] || data.query.random[0].title;
}

// A random moment since Wikipedia started (January 2001).
function randomTime(rand) {
  const first = Date.UTC(2001, 0, 15);
  return new Date(first + rand() * (Date.now() - first)).toISOString();
}

// Seeded random numbers: the same seed always gives the same numbers.
function makeRng(seed) {
  let h = 1779033703 ^ seed.length;
  for (let i = 0; i < seed.length; i++) {
    h = Math.imul(h ^ seed.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  let a = (h ^ (h >>> 16)) >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(list, rand) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// The edit note decides what counts: it has to say something silly or bad was cleaned up.
// Wording comes from Wikipedia's reverting, vandalism and large-language-model pages. Words that also
// appear in normal edits (AI, fake, joke...) only count next to a removal word like "removed" or "revert".
const FUNNY_STRONG = /\b(vandal\w*|rvv|gibberish|nonsens\w*|hoax\w*|troll\w*|memes?|rickroll\w*|keyboard smash|random (?:letters|characters|text|words|garbage)|bogus)\b/i;
const FUNNY_AI_WORDS = /\b(LLMs?|ChatGPT|GPT|chatbot|generative AI|gen-?AI|AI[- ]generated|AI slop|machine-generated|hallucinat\w*)\b/i;
const FUNNY_AMBIGUOUS = /\b(jokes?|joking|prank\w*|silly|silliness|puerile|juvenile|childish|fake|insult\w*|bizarre|absurd\w*|ridiculous|lol|lmao|ha(?:ha)+|hehe+)\b/i;
const FUNNY_AI = /\b(?:AI|A\.I\.)(?!\w)/;
const NOTE_ACTION = /\b(remov\w*|revert\w*|undo|undid|rv|rm|delet\w*|clean\w*|strip\w*|purg\w*|fix\w*|rewrit\w*|cut|trim\w*|restor\w*|per)\b/i;
function isFunnyNote(c) {
  if (BAD_NOTE.test(c) || BAD_TEXT.test(c)) return false;
  if (FUNNY_STRONG.test(c)) return true;
  return (FUNNY_AI_WORDS.test(c) || FUNNY_AI.test(c) || FUNNY_AMBIGUOUS.test(c)) && NOTE_ACTION.test(c);
}
// Lower number = funnier: vandalism and AI text first.
// Plain "vandalism" notes are the most common by far, so notes with any other keyword come first.
const VANDAL_WORDS = /\b(vandal\w*|rvv)\b/gi;
function funTier(c) {
  const other = c.replace(VANDAL_WORDS, "");
  return FUNNY_STRONG.test(other) || FUNNY_AI_WORDS.test(other) || FUNNY_AI.test(other) || FUNNY_AMBIGUOUS.test(other) ? 0 : 1;
}
// Which keyword made a note count (for the console debug numbers).
function keywordOf(c) {
  const m = c.match(FUNNY_STRONG) || c.match(FUNNY_AI_WORDS) || c.match(FUNNY_AI) || c.match(FUNNY_AMBIGUOUS);
  return m ? m[0].toLowerCase() : "?";
}

// Turn wiki code into plain readable text.
function clean(line) {
  let t = line
    .replace(/<!--[\s\S]*?-->/g, "")
    .replace(/<ref[^>]*\/>/g, "")
    .replace(/<ref[^>]*>[\s\S]*?<\/ref>/g, "")
    .replace(/&nbsp;/g, " ");
  while (/\{\{[^{}]*\}\}/.test(t)) t = t.replace(/\{\{[^{}]*\}\}/g, "");
  return t
    .replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g, "$1")
    .replace(/'{2,}/g, "")
    .replace(/<[^>]+>/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function similarity(a, b) {
  const wa = new Set(a.toLowerCase().split(/\W+/));
  const wb = new Set(b.toLowerCase().split(/\W+/));
  let shared = 0;
  wa.forEach((w) => { if (wb.has(w)) shared++; });
  return shared / Math.max(wa.size, wb.size);
}

// Compare two sentences word by word; changed words get flagged.
function diffWords(a, b) {
  const x = a.split(" "), y = b.split(" ");
  const dp = Array.from({ length: x.length + 1 }, () => new Array(y.length + 1).fill(0));
  for (let i = x.length - 1; i >= 0; i--) {
    for (let j = y.length - 1; j >= 0; j--) {
      dp[i][j] = x[i] === y[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  const xs = [], ys = [];
  let i = 0, j = 0;
  while (i < x.length && j < y.length) {
    if (x[i] === y[j]) { xs.push({ t: x[i], d: false }); ys.push({ t: y[j], d: false }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { xs.push({ t: x[i], d: true }); i++; }
    else { ys.push({ t: y[j], d: true }); j++; }
  }
  while (i < x.length) xs.push({ t: x[i++], d: true });
  while (j < y.length) ys.push({ t: y[j++], d: true });
  return [xs, ys];
}

function renderParts(el, parts) {
  el.textContent = "";
  parts.forEach((p, k) => {
    const node = p.d ? document.createElement("mark") : document.createElement("span");
    node.textContent = p.t;
    el.appendChild(node);
    if (k < parts.length - 1) el.appendChild(document.createTextNode(" "));
  });
}

// Keep only ordinary sentences: no adult topics, captions, file names, references or code.
function isPlain(text) {
  if (text.length < MIN_SENTENCE || text.length >= 500) return false;
  if (SUS.test(text) || BAD_TEXT.test(text) || CONTROVERSY.test(text)) return false;
  if (/[|{}<>\[\]=]|http|www\.|&[a-z#0-9]+;/i.test(text)) return false;
  if (/\.(jpe?g|png|gif|svg|webp|pdf|ogg|mp3|tiff?)\b/i.test(text)) return false;
  if (!/^["“'(]?[A-Z0-9]/.test(text)) return false;
  if (!/[.!?]["”'’)]*$/.test(text)) return false;
  const letters = (text.match(/[A-Za-z]/g) || []).length;
  return letters / text.length >= 0.7;
}

// Cut a paragraph into single sentences (without splitting on "Dr." or "U.S.").
const ABBREVIATIONS = /^(?:[A-Z]|Mr|Mrs|Ms|Dr|St|Jr|Sr|vs|No|Inc|Ltd|Co|Mt|Gen|Col|Sen|Rep|Gov|Prof|Rev|Lt|Capt|Sgt|Jan|Feb|Mar|Apr|Aug|Sept|Oct|Nov|Dec|U\.S|U\.K|e\.g|i\.e|c|ca)\.$/;
function splitSentences(text) {
  const out = [];
  const re = /[.!?]["”’')\]]*\s+(?=["“‘(]?[A-Z0-9])/g;
  let start = 0, m;
  while ((m = re.exec(text))) {
    const piece = text.slice(start, m.index + m[0].trimEnd().length);
    if (ABBREVIATIONS.test(piece.split(" ").pop())) continue;
    out.push(piece.trim());
    start = m.index + m[0].length;
  }
  out.push(text.slice(start).trim());
  return out.filter(Boolean);
}

// Ask Wikipedia for just the changed lines (small), then find one sentence that was reworded.
async function diffPair(params, minChange, rand) {
  let data;
  try {
    data = await api({ action: "compare", prop: "diff|timestamp", ...params });
  } catch (e) {
    if (/Missing content|doesn't exist|permission/i.test(e.message)) return null; // deleted edit: skip it
    throw e;
  }
  const html = (data.compare && data.compare.body) || "";
  const doc = new DOMParser().parseFromString("<table>" + html + "</table>", "text/html");
  const rows = [];
  doc.querySelectorAll("tr").forEach((tr) => {
    const d = tr.querySelector("td.diff-deletedline"), a = tr.querySelector("td.diff-addedline");
    if (!d || !a) return;
    const r = d.textContent.trim(), b = a.textContent.trim();
    if (/^[|{}!*#:;=<-]/.test(r) || /^[|{}!*#:;=<-]/.test(b)) return;
    if (/\[\[(File|Image|Category|Media):/i.test(r + b)) return;
    rows.push([r, b]);
  });
  for (const [r, b] of shuffle(rows, rand)) {
    const sentsA = splitSentences(clean(r)), sentsB = splitSentences(clean(b));
    const pairs = [];
    for (const sa of sentsA) {
      if (sentsB.includes(sa) || !isPlain(sa)) continue;
      let best = null, bestSim = MIN_SIM;
      for (const sb of sentsB) {
        if (sentsA.includes(sb) || !isPlain(sb)) continue;
        const sim = similarity(sa, sb);
        if (sim > bestSim) { best = sb; bestSim = sim; }
      }
      if (!best) continue;
      // Skip glued-together pairs where one sentence just contains the other, or is far longer.
      const shorter = Math.min(sa.length, best.length), longer = Math.max(sa.length, best.length);
      const stripEnd = (t) => t.replace(/[.!?"”'’)\s]+$/, "");
      if (stripEnd(sa).includes(stripEnd(best)) || stripEnd(best).includes(stripEnd(sa)) || shorter / longer < MIN_LENGTH_RATIO) continue;
      const [partsA, partsB] = diffWords(sa, best);
      const changed = (partsA.filter((w) => w.d).length + partsB.filter((w) => w.d).length) / (partsA.length + partsB.length);
      if (changed >= minChange) pairs.push({ textA: sa, textB: best, partsA: partsA, partsB: partsB });
    }
    if (pairs.length > 0) {
      const pick = pairs[Math.floor(rand() * pairs.length)];
      return { ...pick, timeA: data.compare.fromtimestamp, timeB: data.compare.totimestamp };
    }
  }
  return null;
}

// Show a timestamp as a short date and time, e.g. "Mar 3, 2015, 4:20 PM".
function niceTime(ts) {
  if (!ts) return "";
  return new Date(ts).toLocaleString([], { year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

// Turn an edit note's wiki code into plain words.
function cleanComment(c) {
  return c
    .replace(/\s*\(\[\[User talk:[^\]]*\]\]\)/g, "")
    .replace(/\s*\(\[\[WP:[^\]]*\]\]\)/g, "")
    .replace(/\/\*.*?\*\//g, "")
    .replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g, "$1")
    .replace(/^(?:Reverted|Reverting|Undid|Undoing)\b[^:]*?\bby\b[^:]*(?::|$)\s*/i, "")
    .replace(/\s*\((?:RW|TW|AWB|HG|STiki|Huggle)[^)]*\)/gi, "")
    .replace(/\s*\(talk\)/gi, "")
    .replace(/'{2,}/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function wikiUrl(title) {
  return "https://en.wikipedia.org/wiki/" + encodeURIComponent(title.replace(/ /g, "_"));
}

// Scan one well-known article's history from a random moment for edits with a funny note.
async function findFunnyEdits(title, rand) {
  const data = await api({
    action: "query", prop: "revisions", titles: title,
    rvlimit: "500", rvdir: "newer", rvstart: randomTime(rand), rvprop: "ids|comment"
  });
  const found = (data.query.pages[0].revisions || [])
    .filter((r) => r.parentid && isFunnyNote(cleanComment(r.comment || "")))
    .map((r) => ({ title: title, revid: r.revid, old_revid: r.parentid, note: cleanComment(r.comment) }));
  found.forEach((r) => {
    const k = keywordOf(r.note);
    wikiDebug.found[k] = (wikiDebug.found[k] || 0) + 1;
  });
  return shuffle(found, rand).sort((a, b) => funTier(a.note) - funTier(b.note)).slice(0, 12);
}

// The article's main picture, if it has one.
async function getImage(title) {
  try {
    const data = await api({ action: "query", prop: "pageimages", piprop: "thumbnail", pithumbsize: "320", titles: title });
    const page = data.query.pages[0];
    return (page.thumbnail && page.thumbnail.source) || "";
  } catch (e) {
    return "";
  }
}

// Skip whole articles about crime, violence or tragedy, judged by the article's categories and opening text.
const TRAGIC_CATEGORY = /\b(murder\w*|killers?|killings?|serial|crimes?|criminals?|convict\w*|prisoners?|executed|massacres?|assassinat\w*|terror\w*|shootings?|attacks?|bombings?|disasters?|accidents?|genocide\w*|holocaust|war crimes?|victims?|abuse\w*|rapists?|kidnap\w*|abduct\w*|hostages?|suicides?|famines?|riots?|lynch\w*|cults?|extremis\w*|violen\w*|necrophil\w*|pedophil\w*|paedophil\w*)\b/i;
const TRAGIC_INTRO = /\b(murder\w*|killer|killed|killing|assassinat\w*|massacre\w*|genocide\w*|terror\w*|shooting|rapist|rape\w*|convicted|executed|bombing|atrocit\w*|abuse\w*|kidnap\w*|suicide|tragedy|tragic|disaster|victims?|hostages?)\b/i;
const safeCache = new Map();
async function isSafeArticle(title) {
  if (safeCache.has(title)) return safeCache.get(title);
  let safe = true;
  try {
    const data = await api({
      action: "query", prop: "categories|extracts", titles: title,
      cllimit: "500", clshow: "!hidden", exintro: "1", explaintext: "1", exchars: "1200"
    });
    const page = data.query.pages[0];
    const cats = (page.categories || []).map((c) => c.title.replace(/^Category:/, "")).join(" | ");
    const intro = page.extract || "";
    if (TRAGIC_CATEGORY.test(cats) || SUS.test(cats) || TRAGIC_INTRO.test(intro) || BAD_TEXT.test(intro.slice(0, 300))) safe = false;
  } catch (e) {
    console.error(e);
  }
  safeCache.set(title, safe);
  return safe;
}

// Edits found earlier but not used yet (endless only), so Wikipedia has to be searched less often.
const spare = [];

// Turn one edit with a funny note into a question. Gives null if this edit is not usable,
// or false if the whole article is off limits.
async function roundFromEdit(title, rc, rand, isDaily) {
  if (!isDaily && (seen.has(rc.revid) || recentTitles.includes(title) || (current && current.revid === rc.revid))) {
    console.debug("[wiki] " + title + ": edit " + rc.revid + " skipped, already shown (or article shown lately)");
    return null;
  }
  progress("Comparing two versions of " + title + "...");
  const pair = await diffPair({ fromrev: String(rc.old_revid), torev: String(rc.revid) }, MIN_CHANGE, rand);
  if (!pair) { wikiDebug.noPair++; console.debug("[wiki] " + title + ": edit " + rc.revid + " skipped, no sentence was reworded in a usable way"); return null; }
  const flagged = [...pair.partsA, ...pair.partsB].some((w) =>
    w.d && w.t.split(/[^A-Za-z]+/).some((x) => GENDER.test(x) || BAD_CHANGED.test(x) || PROFANE_PART.test(x)));
  if (flagged) { console.debug("[wiki] " + title + ": edit " + rc.revid + " skipped, a changed word is on the block list"); return null; }
  const key = textKey(pair.textA, pair.textB);
  if (!isDaily && seen.has(key)) { wikiDebug.repeats++; console.debug("[wiki] " + title + ": edit " + rc.revid + " skipped, same sentences already shown"); return null; }
  progress("Checking that " + title + " is a suitable article...");
  if (!(await isSafeArticle(title))) { wikiDebug.unsafe++; console.debug("[wiki] " + title + ": whole article skipped, not a suitable topic"); return false; }
  const keyword = keywordOf(rc.note);
  wikiDebug.shown[keyword] = (wikiDebug.shown[keyword] || 0) + 1;
  console.info("[wiki] found:", title, "| keyword:", keyword, "| note:", rc.note);
  progress("Fetching the picture for " + title + "...");
  return {
    revid: rc.revid,
    key: key,
    title: title,
    image: await getImage(title),
    summary: "Note from the editor who made the change: ",
    note: rc.note,
    diffUrl: "https://en.wikipedia.org/w/index.php?title=" + encodeURIComponent(title.replace(/ /g, "_")) +
      "&diff=" + rc.revid + "&oldid=" + rc.old_revid,
    options: shuffle([
      { text: pair.textA, parts: pair.partsA, answer: false, when: niceTime(pair.timeA) },
      { text: pair.textB, parts: pair.partsB, answer: true, when: niceTime(pair.timeB) }
    ], rand)
  };
}

// One round: the older sentence is the mistake and the newer one is the fix.
// Endless rounds skip edits this browser has already shown. Daily rounds only use the seeded random numbers.
async function makeRound(rand, isDaily, avoid) {
  if (!isDaily && spare.length > 0) {
    const item = spare.splice(Math.floor(Math.random() * spare.length), 1)[0];
    progress("Checking an edit found earlier on " + item.title + "...");
    syncSeen();
    return (await roundFromEdit(item.title, item.rc, rand, false)) || null;
  }
  let title;
  if (isDaily) {
    const pool = await getDailyPool();
    title = pool[Math.floor(rand() * pool.length)];
  } else {
    title = await pickTitle(POPULAR_CHANCE, rand);
  }
  if (SUS.test(title) || BAD_TEXT.test(title) || (avoid && avoid.includes(title)) || (!isDaily && recentTitles.includes(title))) return null;
  wikiDebug.attempts++;
  const roundStart = performance.now();
  if (!isDaily) syncSeen();
  progress("Reading the edit history of " + title + "...");
  const edits = await findFunnyEdits(title, rand);
  if (edits.length === 0) {
    wikiDebug.noEdits++;
    console.debug("[wiki] " + title + ": no edit with a funny note in that stretch of history (" + Math.round(performance.now() - roundStart) + " ms)");
    return null;
  }
  console.debug("[wiki] " + title + ": " + edits.length + " edit(s) with a funny note, trying up to " + EDITS_TO_TRY + " (" + Math.round(performance.now() - roundStart) + " ms so far)");
  const keep = (list) => list.forEach((rc) => { if (!isDaily && spare.length < 150) spare.push({ title: title, rc: rc }); });
  const tryNow = Math.min(edits.length, EDITS_TO_TRY);
  for (let i = 0; i < tryNow; i++) {
    const round = await roundFromEdit(title, edits[i], rand, isDaily);
    if (round === false) return null;
    if (round) {
      keep(edits.slice(i + 1));
      console.info("[wiki] built a question from " + title + " in " + Math.round(performance.now() - roundStart) + " ms (edit " + (i + 1) + " of " + edits.length + ")");
      return round;
    }
  }
  keep(edits.slice(tryNow));
  console.debug("[wiki] " + title + ": none of the first " + tryNow + " edits worked (" + Math.round(performance.now() - roundStart) + " ms), kept the rest for later");
  return null;
}

// Endless mode: try three articles at the same time and keep the first good result.
async function buildRound() {
  let lastError = null, done = false;
  const worker = async () => {
    for (let n = 0; n < 120 && !done; n++) {
      try {
        const round = await makeRound(Math.random, false);
        if (round) return round;
      } catch (e) {
        console.error(e);
        lastError = e;
      }
    }
    throw new Error("no match");
  };
  try {
    return await Promise.any(Array.from({ length: 3 }, () => worker()));
  } catch (e) {
    throw new Error("Could not find a good pair (" + (lastError ? lastError.message : "no matches") + ")");
  } finally {
    done = true;
  }
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// Daily question number k. Every attempt has its own seed and the lowest attempt that works wins,
// so everyone gets the same question no matter how fast their connection is.
async function tryDailyAttempt(k, i, avoid) {
  for (let t = 0; t < 2; t++) {
    try {
      return await makeRound(makeRng(daily.key + ":" + k + ":" + i), true, avoid);
    } catch (e) {
      console.error(e);
      await sleep(2000);
    }
  }
  return null;
}

async function buildDaily(k, avoid) {
  await getDailyPool();
  for (let i = 0; i < 90; i += 3) {
    const batch = await Promise.all(Array.from({ length: 3 }, (_, j) => tryDailyAttempt(k, i + j, avoid)));
    const hit = batch.find(Boolean);
    if (hit) return hit;
  }
  throw new Error("Could not build today's challenge");
}

// Start building the next question while the player is still reading this one.
function prefetchNext() {
  const k = daily.results.length;
  let tag, promise;
  if (mode === "daily" && k + 1 < DAILY_COUNT) {
    tag = "daily" + (k + 1);
    promise = buildDaily(k + 1, daily.titles.slice(0, k + 1));
  } else {
    tag = "endless";
    promise = buildRound();
  }
  prefetched = { tag: tag, promise: promise };
  promise.catch(() => {});
}

function dailyScore() { return daily.results.reduce((a, b) => a + b, 0); }

// Text to paste into Discord (Discord markdown).
function shareText() {
  const squares = daily.results.map((r) => (r ? "🟩" : "🟥")).join("");
  return "**[Wiki Edit War - Daily #" + dailyNumber + "](" + SHARE_URL + ")** (" + daily.key + ")\n" +
    squares + " **" + dailyScore() + "/" + DAILY_COUNT + "**";
}

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const box = document.createElement("textarea");
    box.value = text;
    document.body.appendChild(box);
    box.select();
    try { document.execCommand("copy"); } catch (err) {}
    box.remove();
  }
  const label = btn.dataset.label || btn.textContent;
  btn.dataset.label = label;
  btn.textContent = "Copied!";
  setTimeout(() => { btn.textContent = label; }, 1500);
}

function renderBar() {
  const isDaily = mode === "daily";
  $("score").textContent = isDaily ? dailyScore() : score;
  $("played").textContent = isDaily ? daily.results.length : played;
  $("streak").textContent = streak;
  $("dailyBtn").classList.toggle("hidden", !(mode === "endless" && daily.results.length >= DAILY_COUNT));
}

function show(round) {
  current = round;
  seen.add(round.revid);
  seen.add(round.key);
  saveSeen();
  if (mode !== "daily") {
    recentTitles.push(round.title);
    recentTitles = recentTitles.slice(-60);
    save("wikiTitles", recentTitles);
  }
  if (mode === "daily") {
    daily.titles[daily.results.length] = round.title;
    save("wikiDaily", daily);
  }
  $("modeLabel").textContent = mode === "daily"
    ? "Daily challenge #" + dailyNumber + " - question " + (daily.results.length + 1) + " of " + DAILY_COUNT
    : "Endless";
  renderBar();
  $("articleLink").textContent = round.title;
  $("articleLink").href = wikiUrl(round.title);
  $("pic").classList.toggle("hidden", !round.image);
  $("picImg").src = round.image || "";
  $("picImg").alt = round.title;
  round.options.forEach((opt, i) => {
    const btn = $("c" + i);
    btn.disabled = false;
    btn.className = "choice";
    renderParts(btn.querySelector(".text"), opt.parts);
    btn.querySelector(".tag").textContent = "Version " + (i + 1);
  });
  $("result").classList.add("hidden");
  $("shareBox").classList.add("hidden");
  $("status").classList.add("hidden");
  $("game").classList.remove("hidden");
}

function guess(i) {
  const opts = current.options;
  const correct = opts[i].answer;
  if (correct) streak++; else streak = 0;
  if (mode === "daily") {
    daily.results.push(correct ? 1 : 0);
    save("wikiDaily", daily);
  } else {
    played++;
    if (correct) score++;
  }
  opts.forEach((opt, k) => {
    const btn = $("c" + k);
    btn.disabled = true;
    if (opt.answer) btn.classList.add("correct");
    else if (k === i) btn.classList.add("wrong");
    if (k === i) btn.classList.add("picked");
    btn.querySelector(".tag").textContent =
      "Version " + (k + 1) + " - " + (opt.answer ? "the fix" : "the mistake") + (opt.when ? " - " + opt.when : "");
  });
  $("verdict").textContent = correct ? "You got it." : "Not this time.";
  $("verdict").className = "verdict " + (correct ? "good" : "bad");
  $("summary").textContent = current.summary;
  $("summary").classList.toggle("hidden", !current.summary);
  if (current.note) {
    const bold = document.createElement("strong");
    bold.textContent = current.note;
    $("summary").appendChild(bold);
  }
  $("diffLink").href = current.diffUrl;
  renderBar();
  const finished = mode === "daily" && daily.results.length >= DAILY_COUNT;
  $("shareBox").classList.toggle("hidden", !finished);
  if (finished) {
    $("shareHead").textContent = "Daily challenge complete: " + dailyScore() + "/" + DAILY_COUNT;
    $("shareText").value = shareText();
  }
  $("nextBtn").textContent = finished ? "Keep playing (endless)" : mode === "daily" ? "Next question" : "Next edit war";
  $("result").classList.remove("hidden");
  $("nextBtn").focus();
}

async function nextRound() {
  const my = ++ticket;
  const t0 = performance.now();
  if (mode === "daily" && daily.results.length >= DAILY_COUNT) mode = "endless";
  $("game").classList.add("hidden");
  $("status").textContent = mode === "daily" ? "Loading today's challenge..." : "Loading a real edit war...";
  $("status").classList.remove("hidden");
  $("retryBtn").classList.add("hidden");
  loading = true;
  try {
    const k = daily.results.length;
    const tag = mode === "daily" ? "daily" + k : "endless";
    const waiting = prefetched;
    prefetched = null;
    let round = null;
    if (waiting && waiting.tag === tag) {
      try { round = await waiting.promise; } catch (e) { console.error(e); }
    }
    if (!round) round = await (mode === "daily" ? buildDaily(k, daily.titles.slice(0, k)) : buildRound());
    if (my !== ticket) return;
    loading = false;
    show(round);
    console.info("[wiki] question ready in " + Math.round(performance.now() - t0) + " ms (" +
      (waiting && waiting.tag === tag ? "prefetched" : "built fresh") + ") | attempts so far: " + wikiDebug.attempts);
    console.info("[wiki] totals so far: " + wikiDebug.attempts + " articles checked, " + wikiDebug.noEdits + " had no funny edits, " +
      wikiDebug.noPair + " edits had no usable sentence, " + wikiDebug.repeats + " repeats, " + wikiDebug.unsafe + " unsuitable articles, " +
      wikiDebug.slowdowns + " slow-down replies (" + Math.round(wikiDebug.waitedMs / 1000) + " s spent waiting)");
    prefetchNext();
  } catch (e) {
    if (my !== ticket) return;
    loading = false;
    $("status").textContent = "Something went wrong: " + e.message;
    $("retryBtn").classList.remove("hidden");
  }
}

$("c0").addEventListener("click", () => guess(0));
$("c1").addEventListener("click", () => guess(1));
$("nextBtn").addEventListener("click", nextRound);
$("retryBtn").addEventListener("click", nextRound);
$("copyBtn").addEventListener("click", () => copyText(shareText(), $("copyBtn")));
$("dailyBtn").addEventListener("click", () => copyText(shareText(), $("dailyBtn")));

try {
  const saved = localStorage.getItem("wikiRegion");
  if (saved !== null) region = saved;
} catch (e) {}
$("region").value = region;
$("region").addEventListener("change", () => {
  region = $("region").value;
  try { localStorage.setItem("wikiRegion", region); } catch (e) {}
  poolPromise = null;
  prefetched = null;
  if (mode === "endless") nextRound();
});

if (TEST) document.querySelector(".ver").textContent += " TEST";
renderBar();
nextRound();
</script>
</body>
</html>
